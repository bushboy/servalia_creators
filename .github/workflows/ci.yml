name: CI

on:
  push:
    branches: [main, phase-a-hardening]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check thebe_core tests
      - name: Type check with mypy
        run: mypy thebe_core

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run bandit
        run: bandit -r thebe_core -f json -o bandit-report.json || true
      - name: Run pip-audit
        run: pip-audit --desc

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: thebe
          POSTGRES_PASSWORD: thebe
          POSTGRES_DB: thebe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Alembic migration check
        env:
          DATABASE_URL: "postgresql+asyncpg://thebe:thebe@localhost:5432/thebe"
        run: |
          set -e
          alembic heads | tee /tmp/alembic-heads.txt
          test "$(wc -l < /tmp/alembic-heads.txt)" -eq 1
          alembic upgrade head
          alembic current
      - name: Run tests
        env:
          DATABASE_URL: "postgresql+asyncpg://thebe:thebe@localhost:5432/thebe"
          PII_ENCRYPTION_KEY: "WJUOLW0cIk_DxCa7xGy6Gw63wOVU4qZhG9vIzLJNxiQ="
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: Run Vitest
        run: npm run test -- --run

  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start API
        env:
          SEED_TEST_TENANT: "1"
          PII_ENCRYPTION_KEY: "WJUOLW0cIk_DxCa7xGy6Gw63wOVU4qZhG9vIzLJNxiQ="
          DATABASE_URL: "sqlite+aiosqlite:///./e2e.db"
        run: |
          nohup uvicorn thebe_core.api:app --host 127.0.0.1 --port 8000 > /tmp/e2e-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install frontend
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: ./frontend
        env:
          E2E_API: "1"
          E2E_API_KEY: "test-api-key:test-secret"
          VITE_API_BASE_URL: "/api"
          VITE_API_PROXY_TARGET: "http://127.0.0.1:8000"
          CI: "true"
        run: |
          curl -sf http://127.0.0.1:8000/health
          npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        run: docker build -t thebe-core:ci .
      - name: Build frontend Docker image
        run: docker build -t thebe-frontend:ci ./frontend
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: thebe-core:ci
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
