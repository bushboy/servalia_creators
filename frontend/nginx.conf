map $http_x_forwarded_proto $creatortrust_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost creators.delegant.online _;
    root /usr/share/nginx/html;
    index index.html;

    client_header_buffer_size 64k;
    large_client_header_buffers 8 64k;
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend.
    # On the CreatorTrust Compose network, service name `api` resolves to
    # creatortrust-api (internal port 8000; host maps 8200 on the sidecar).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $creatortrust_forwarded_proto;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
