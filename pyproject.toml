[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thebe-gov-core"
version = "0.2.0"
description = "Servalia governance core used by CreatorTrust"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0",
    "sqlmodel>=0.0.18,<0.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "uvicorn>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0,<1.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "slowapi>=0.1.9",
    "limits>=3.0.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thebe_core*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "attr-defined"]
exclude = ["migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
