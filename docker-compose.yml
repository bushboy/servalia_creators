name: creatortrust

services:
  postgres:
    container_name: creatortrust-postgres
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - creatortrust_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: creatortrust-keycloak
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    container_name: creatortrust-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_ISSUER_URL: http://localhost:8180/realms/servalia
      OIDC_JWKS_URL: http://keycloak:8080/realms/servalia/protocol/openid-connect/certs
      OIDC_CLIENT_ID: creatortrust-frontend
      OIDC_AUDIENCE: creatortrust-frontend
      CORS_ORIGINS: http://localhost:5173,http://localhost:3080
      SEED_TEST_TENANT: "true"
      SEED_OIDC_TEST_USER_SUB: "11111111-1111-1111-1111-111111111111"
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn thebe_core.api:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./verticals:/app/verticals:ro

  frontend:
    container_name: creatortrust-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    environment:
      API_BASE_URL: /api
      OIDC_AUTHORITY: http://localhost:8180/realms/servalia
      OIDC_CLIENT_ID: creatortrust-frontend
      OIDC_REDIRECT_URI: http://localhost:3080/login/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:3080/login
    ports:
      - "3080:80"
    depends_on:
      - api

volumes:
  creatortrust_pg_data:
